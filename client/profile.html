<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - JPL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">JPL Auction</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto" id="nav-links"></ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">User Profile</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="text-muted small">Full Name</label>
                            <h5 id="pName">Loading...</h5>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">Enrollment Number</label>
                            <h5 id="pEnrollment">Loading...</h5>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">College Email</label>
                            <h5 id="pEmail">Loading...</h5>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">Mobile Number</label>
                            <h5 id="pMobile">Loading...</h5>
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label class="text-muted small">Available Purse</label>
                            <h3 class="text-success fw-bold" id="pPurse">₹0</h3>
                        </div>
                        <div class="text-center mt-4">
                            <a href="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetchWithAuth('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    const u = data.user;
                    document.getElementById('pName').textContent = u.full_name;
                    document.getElementById('pEnrollment').textContent = u.enrollment_number;
                    document.getElementById('pEmail').textContent = u.email;
                    document.getElementById('pMobile').textContent = u.mobile;
                    document.getElementById('pPurse').textContent = `₹${u.purse}`;
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
