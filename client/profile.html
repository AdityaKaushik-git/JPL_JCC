<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - JPL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg jpl-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-gavel me-2"></i>JPL Auction</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-links"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card shadow-sm p-0 overflow-hidden">
                    <div class="bg-primary text-white p-4">
                        <h4 class="mb-0 fw-bold"><i class="fas fa-user-circle me-2"></i>User Profile</h4>
                    </div>
                    <div class="p-4">
                        <div class="mb-4 border-bottom pb-3">
                            <label class="text-muted small fw-bold text-uppercase">Full Name</label>
                            <h5 id="pName" class="mb-0">Loading...</h5>
                        </div>
                        <div class="mb-4 border-bottom pb-3">
                            <label class="text-muted small fw-bold text-uppercase">Enrollment Number</label>
                            <h5 id="pEnrollment" class="mb-0">Loading...</h5>
                        </div>
                        <div class="mb-4 border-bottom pb-3">
                            <label class="text-muted small fw-bold text-uppercase">College Email</label>
                            <h5 id="pEmail" class="mb-0">Loading...</h5>
                        </div>
                        <div class="mb-4">
                            <label class="text-muted small fw-bold text-uppercase">Mobile Number</label>
                            <h5 id="pMobile" class="mb-0">Loading...</h5>
                        </div>
                        
                        <div class="mt-4 pt-3 text-center bg-light rounded p-3">
                            <label class="text-muted small fw-bold text-uppercase d-block mb-2">Available Purse</label>
                            <h2 class="text-success fw-bold m-0" id="pPurse">₹0</h2>
                        </div>
                        
                        <div class="text-center mt-4 pt-3 border-top">
                            <a href="/dashboard" class="btn btn-outline-secondary px-4"><i class="fas fa-arrow-left me-2"></i>Back to Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetchWithAuth('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    const u = data.user;
                    document.getElementById('pName').textContent = u.full_name;
                    document.getElementById('pEnrollment').textContent = u.enrollment_number;
                    document.getElementById('pEmail').textContent = u.email;
                    document.getElementById('pMobile').textContent = u.mobile;
                    document.getElementById('pPurse').textContent = `₹${u.purse}`;
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
