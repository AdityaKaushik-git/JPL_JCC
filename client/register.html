<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JPL Auction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="split-layout">
    <div class="split-left d-none d-md-flex">
        <h1 class="display-3 fw-bold text-warning mb-3"><i class="fas fa-user-plus"></i></h1>
        <h2 class="text-white fw-bold">Join the Action</h2>
        <p class="text-muted">Register to bid on players or participate as a player in the JPL Auction!</p>
    </div>
    <div class="split-right">
        <div class="glass-card w-100" style="max-width:520px; max-height:90vh; overflow-y:auto;">
            <h3 class="text-center fw-bold mb-1">Create Account</h3>
            <p class="text-center text-muted mb-4">Join the JPL Auction Platform</p>
            <div id="registerAlert" class="alert d-none"></div>

            <form id="registerForm">
                <!-- Role Selection -->
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Register As:</label>
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="role-card" onclick="selectRole('user')" id="roleCardBidder">
                                <i class="fas fa-gavel role-icon"></i>
                                <div class="fw-bold">Team Captain</div>
                                <small class="text-muted">Bid on players</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="role-card" onclick="selectRole('player')" id="roleCardPlayer">
                                <i class="fas fa-running role-icon"></i>
                                <div class="fw-bold">Player</div>
                                <small class="text-muted">Get auctioned</small>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="role" name="role" value="user">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Full Name</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="full_name" placeholder="Enter full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Enrollment Number</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="enrollment_number" placeholder="e.g. 21BTCS001" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Email</label>
                    <input type="email" class="form-control bg-dark text-white border-secondary" id="email" placeholder="your@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Mobile Number</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="mobile" placeholder="10-digit mobile" required>
                </div>

                <!-- Player-specific Fields -->
                <div id="playerFields" class="d-none">
                    <div class="mb-3">
                        <label class="form-label text-muted">Playing Role</label>
                        <select class="form-select bg-dark text-white border-secondary" id="playing_role">
                            <option value="Batsman">Batsman</option>
                            <option value="Bowler">Bowler</option>
                            <option value="All-Rounder">All-Rounder</option>
                            <option value="Wicket Keeper">Wicket Keeper</option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label text-muted">Course</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="course" placeholder="e.g. BTech">
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted">Year</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="year" placeholder="e.g. 3rd">
                        </div>
                    </div>
                </div>

                <div class="mb-3 mt-3">
                    <label class="form-label text-muted">Password</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="password" placeholder="Create password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Confirm Password</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="confirm_password" placeholder="Repeat password" required>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-2 mb-3 fw-bold">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
                <div class="text-center text-muted">
                    Already have an account? <a href="/login" class="text-warning text-decoration-none">Login here</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Default role is user (bidder)
    selectRole('user');

    function selectRole(role) {
        document.getElementById('role').value = role;
        document.getElementById('roleCardBidder').classList.remove('active');
        document.getElementById('roleCardPlayer').classList.remove('active');
        if (role === 'user') {
            document.getElementById('roleCardBidder').classList.add('active');
            document.getElementById('playerFields').classList.add('d-none');
        } else {
            document.getElementById('roleCardPlayer').classList.add('active');
            document.getElementById('playerFields').classList.remove('d-none');
        }
    }
</script>
<script src="/js/auth.js"></script>
</body>
</html>
