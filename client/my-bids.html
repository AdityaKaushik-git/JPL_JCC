<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bids - JPL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">JPL Auction</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto" id="nav-links"></ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">My Bid History</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Player Name</th>
                            <th>Bid Amount</th>
                            <th>Date & Time</th>
                        </tr>
                    </thead>
                    <tbody id="bidsBody">
                        <tr><td colspan="3" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetchWithAuth('/api/users/bids');
                const data = await res.json();
                const tbody = document.getElementById('bidsBody');
                
                if (data.bids.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">You have not placed any bids yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.bids.forEach(b => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-bold">${b.player_name}</td>
                        <td class="text-primary fw-bold">₹${b.bid_amount}</td>
                        <td>${new Date(b.created_at).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
