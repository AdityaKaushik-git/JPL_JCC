<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JPL Auction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="split-layout">
    <div class="split-left d-none d-md-flex">
        <h1 class="display-3 fw-bold text-warning mb-3"><i class="fas fa-gavel"></i></h1>
        <h2 class="text-white fw-bold">JPL Auction</h2>
        <p class="text-muted">The Premier College Player Auction Experience. Log in to place bids and build your dream team!</p>
    </div>
    <div class="split-right">
        <div class="glass-card w-100" style="max-width:420px;">
            <h3 class="text-center fw-bold mb-1">Welcome Back</h3>
            <p class="text-center text-muted mb-4">Login to your account</p>
            <div id="loginAlert" class="alert d-none"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted">Email or Enrollment No.</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="loginId" placeholder="email or enrollment" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control bg-dark text-white border-secondary" id="password" placeholder="password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-gold w-100 py-2 mb-3 fw-bold">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
                <div class="text-center text-muted">
                    Don't have an account? <a href="/register" class="text-warning text-decoration-none">Register here</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
