<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JPL Auction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="split-layout">
    <div class="split-left">
        <h1 class="display-3 fw-bold text-warning mb-3"><i class="fas fa-gavel"></i></h1>
        <h2 class="text-white">Welcome Back</h2>
        <p class="text-muted">Log in to continue to the JPL Auction platform.</p>
    </div>
    <div class="split-right">
        <div class="glass-card w-100" style="max-width: 400px;">
            <h3 class="text-center text-white mb-4">Login</h3>
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="btn btn-gold w-100 py-2 mb-3">Login</button>
                <div class="text-center text-muted">
                    Don't have an account? <a href="register.html" class="text-warning text-decoration-none">Register here</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
