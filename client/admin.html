<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - JPL Auction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg jpl-navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#"><i class="fas fa-shield-alt text-danger me-2"></i> JPL Admin</a>
        <div class="d-flex align-items-center">
            <span class="badge bg-danger">Admin Mode</span>
        </div>
    </div>
</nav>

<div class="container-fluid py-4">
    <!-- Stats Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card border-secondary text-center p-3">
                <small class="text-muted d-block">Total Users</small>
                <h3 class="text-dark m-0" id="statUsers">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card border-info text-center p-3">
                <small class="text-muted d-block">Available Players</small>
                <h3 class="text-info m-0" id="statAvailable">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card border-success text-center p-3">
                <small class="text-muted d-block">Sold</small>
                <h3 class="text-success m-0" id="statSold">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card border-danger text-center p-3">
                <small class="text-muted d-block">Unsold</small>
                <h3 class="text-danger m-0" id="statUnsold">0</h3>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Player Roster -->
        <div class="col-lg-3">
            <div class="glass-card h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="m-0"><i class="fas fa-users me-2 text-orange"></i>Roster</h5>
                    <div class="d-flex gap-2 align-items-center">
                        <span class="badge bg-warning text-dark" id="totalPlayersBadge">0</span>
                        <button class="btn btn-sm btn-orange fw-bold" data-bs-toggle="modal" data-bs-target="#addPlayerModal">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>
                </div>
                <div id="noPlayerAlert"></div>
                <div id="playerList" class="list-group list-group-flush flex-grow-1 overflow-auto" style="max-height: 60vh;">
                    <!-- Players listed here -->
                </div>
            </div>
        </div>

        <!-- Auction Console -->
        <div class="col-lg-6">
            <div class="glass-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
                    <h4 class="m-0 text-warning">Live Control</h4>
                    <span class="badge bg-success fs-6"><span class="live-indicator bg-white"></span><span id="auctionStatus">Active</span></span>
                </div>
                
                <div id="activePlayerSection" class="text-center p-4 glass-card rounded mb-4">
                    <h2 id="currentPlayerName" class="text-dark mb-2">Select a Player</h2>
                    <p id="currentPlayerRole" class="text-info mb-4">-</p>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-6 text-end pe-4 border-end border-secondary">
                            <small class="text-muted d-block">Base Price</small>
                            <h4 class="text-dark m-0">₹<span id="currentBasePrice">0</span></h4>
                        </div>
                        <div class="col-6 text-start ps-4">
                            <small class="text-muted d-block">Current Bid</small>
                            <h3 class="text-warning m-0">₹<span id="currentBid">0</span></h3>
                            <small class="text-success">By: <span id="highestBidder">None</span></small>
                        </div>
                    </div>

                    <div class="timer-display mb-4" id="timeLeft">00</div>

                    <div class="d-flex justify-content-center gap-3">
                        <button class="btn btn-outline-warning" id="btnPause"><i class="fas fa-pause"></i> Pause</button>
                        <button class="btn btn-outline-info" id="btnResume"><i class="fas fa-play"></i> Resume</button>
                    </div>
                </div>

                <div class="d-flex gap-3">
                    <button class="btn btn-success flex-grow-1 py-3 fw-bold fs-5" id="btnSell"><i class="fas fa-gavel"></i> Sell Player</button>
                    <button class="btn btn-danger flex-grow-1 py-3 fw-bold fs-5" id="btnUnsold"><i class="fas fa-times"></i> Mark Unsold</button>
                </div>
            </div>
        </div>

        <!-- Bid History -->
        <div class="col-lg-3">
            <div class="glass-card h-100 d-flex flex-column">
                <h5 class="mb-3 border-bottom border-secondary pb-2"><i class="fas fa-history me-2"></i>Log</h5>
                <ul id="bidHistoryList" class="list-unstyled flex-grow-1 overflow-auto small" style="max-height: 60vh;">
                    <!-- Admin bid history -->
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- Add Player Modal -->
<div class="modal fade" id="addPlayerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background:#fff; border:1px solid #e5e7eb;">
            <div class="modal-header border-bottom" style="border-color:#e5e7eb !important;">
                <h5 class="modal-title fw-bold"><i class="fas fa-user-plus me-2 text-orange"></i>Add New Player</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="addPlayerAlert" class="alert d-none"></div>
                <form id="addPlayerForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-control" id="ap_name" placeholder="Player full name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Enrollment Number *</label>
                        <input type="text" class="form-control" id="ap_enrollment" placeholder="e.g. 21BTCS001" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Playing Role *</label>
                        <select class="form-select" id="ap_role" required>
                            <option value="">-- Select Role --</option>
                            <option value="Batsman">Batsman</option>
                            <option value="Bowler">Bowler</option>
                            <option value="All-Rounder">All-Rounder</option>
                            <option value="Wicket Keeper">Wicket Keeper</option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Course *</label>
                            <input type="text" class="form-control" id="ap_course" placeholder="e.g. BTech" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Year *</label>
                            <input type="text" class="form-control" id="ap_year" placeholder="e.g. 3rd" required>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label">Base Price (₹) *</label>
                        <input type="number" class="form-control" id="ap_base_price" placeholder="e.g. 10000" min="1000" max="5000000" required>
                        <div class="form-text text-muted">Minimum ₹1,000 — Maximum ₹50,00,000</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top" style="border-color:#e5e7eb !important;">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-orange fw-bold px-4" id="btnAddPlayer">
                    <i class="fas fa-plus me-2"></i>Add Player
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="/socket.io/socket.io.js"></script><script src="/js/main.js"></script><script src="/js/admin.js"></script>
</body>
</html>
